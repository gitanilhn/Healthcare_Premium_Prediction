name: AWS S3 Connection Test

on:
  push:
    branches:
      - main

jobs:
  s3-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install Dependencies
        run: uv sync --locked

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Download Model Artifacts
        run: |
          mkdir -p artifacts/latest

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/ \
            artifacts/latest/ \
            --recursive

      - name: Verify Downloaded Artifacts
        run: |
          ls -R artifacts

          test -f artifacts/latest/model.pkl
          test -f artifacts/latest/preprocessor.pkl
          test -f artifacts/latest/metadata.json
          test -f artifacts/latest/feature_schema.json

      - name: Run Unit Tests
        env:
          APP_ENV: ci
          MODEL_SOURCE: local
        run: uv run pytest -v