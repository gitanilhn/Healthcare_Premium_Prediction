name: Healthcare Premium CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Unit Tests
        env:
          MODEL_LOAD_MODE: local
          MODEL_LOCAL_DIR: artifacts/latest
        run: uv run pytest -v

      - name: Check Black Formatting
        run: uv run black --check app.py schemas.py src tests

      - name: Run Flake8
        run: uv run flake8 app.py schemas.py src tests