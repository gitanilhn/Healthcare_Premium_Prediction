name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:

    name: Test and Build

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. INSTALL UV
      # ============================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6


      # ============================================================
      # 4. INSTALL EXACT LOCKED DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          uv sync --locked


      # ============================================================
      # 5. VERIFY PYTHON ENVIRONMENT
      # ============================================================

      - name: Verify Python environment
        run: |
          uv run python --version

          uv run python -c "import boto3"
          uv run python -c "import sklearn"
          uv run python -c "import xgboost"
          uv run python -c "import fastapi"

          echo "All required packages imported successfully."


      # ============================================================
      # 6. RUN UNIT TESTS
      # ============================================================

      - name: Run tests
        run: |
          uv run pytest -v


      # ============================================================
      # 7. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t healthcare-premium-api:${{ github.sha }} \
            .


      # ============================================================
      # 8. VERIFY DOCKER IMAGE
      # ============================================================

      - name: Verify Docker image
        run: |
          docker images