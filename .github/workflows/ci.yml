
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# Required for AWS OIDC authentication
# ============================================================

permissions:
  id-token: write
  contents: read


jobs:

  test:

    name: Test and Build

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. INSTALL UV
      # ============================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6


      # ============================================================
      # 4. INSTALL EXACT LOCKED DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          uv sync --locked


      # ============================================================
      # 5. VERIFY PYTHON ENVIRONMENT
      # ============================================================

      - name: Verify Python environment
        run: |
          uv run python --version

          uv run python -c "import boto3"
          uv run python -c "import sklearn"
          uv run python -c "import xgboost"
          uv run python -c "import fastapi"

          echo "All required packages imported successfully."


      # ============================================================
      # 6. CONFIGURE AWS CREDENTIALS USING GITHUB OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-south-1


      # ============================================================
      # 7. VERIFY AWS CONNECTION
      # ============================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ============================================================
      # 8. DOWNLOAD MODEL ARTIFACTS FROM S3
      # ============================================================

      - name: Download model artifacts from S3
        run: |
          mkdir -p artifacts/latest

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/model.pkl \
            artifacts/latest/model.pkl

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/preprocessor.pkl \
            artifacts/latest/preprocessor.pkl

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/metadata.json \
            artifacts/latest/metadata.json

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/feature_schema.json \
            artifacts/latest/feature_schema.json


      # ============================================================
      # 9. VERIFY MODEL ARTIFACTS
      # ============================================================

      - name: Verify model artifacts
        run: |
          echo "Checking downloaded model artifacts..."

          test -f artifacts/latest/model.pkl
          test -f artifacts/latest/preprocessor.pkl
          test -f artifacts/latest/metadata.json
          test -f artifacts/latest/feature_schema.json

          echo "All required model artifacts are available."

          ls -lh artifacts/latest


      # ============================================================
      # 10. RUN UNIT TESTS
      # ============================================================

      - name: Run tests
        env:
          MODEL_SOURCE: local
          MODEL_VERSION: v2
        run: |
          uv run pytest -v


      # ============================================================
      # 11. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t healthcare-premium-api:${{ github.sha }} \
            .


      # ============================================================
      # 12. VERIFY DOCKER IMAGE
      # ============================================================

      - name: Verify Docker image
        run: |
          docker images healthcare-premium-api