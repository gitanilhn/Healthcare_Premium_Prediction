name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Check code formatting
        run: uv run black --check app.py schemas.py src tests

      - name: Run Flake8
        run: uv run flake8 app.py schemas.py src tests