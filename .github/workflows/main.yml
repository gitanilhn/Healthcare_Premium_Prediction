name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. INSTALL UV
      # ============================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          uv sync --locked

      # ============================================================
      # 5. VERIFY PYTHON ENVIRONMENT
      # ============================================================

      - name: Verify Python environment
        run: |
          uv run python --version
          uv run python -c "import boto3"
          uv run python -c "import sklearn"
          uv run python -c "import xgboost"
          uv run python -c "import fastapi"

          echo "Python environment verified."

      # ============================================================
      # 6. CONFIGURE AWS (OIDC)
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # ============================================================
      # 7. VERIFY AWS LOGIN
      # ============================================================

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ============================================================
      # 8. DOWNLOAD MODEL ARTIFACTS
      # ============================================================

      - name: Download model artifacts
        run: |
          mkdir -p artifacts/latest

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/model.pkl \
            artifacts/latest/model.pkl

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/preprocessor.pkl \
            artifacts/latest/preprocessor.pkl

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/metadata.json \
            artifacts/latest/metadata.json

          aws s3 cp \
            s3://healthcare-premium-mlops-anil/models/healthcare-premium-prediction/v1/feature_schema.json \
            artifacts/latest/feature_schema.json

      # ============================================================
      # 9. VERIFY ARTIFACTS
      # ============================================================

      - name: Verify model artifacts
        run: |
          ls -lh artifacts/latest

          test -f artifacts/latest/model.pkl
          test -f artifacts/latest/preprocessor.pkl
          test -f artifacts/latest/metadata.json
          test -f artifacts/latest/feature_schema.json

          echo "Model artifacts downloaded successfully."

      # ============================================================
      # 10. RUN UNIT TESTS
      # ============================================================

      - name: Run Tests
        env:
          MODEL_SOURCE: local
        run: |
          uv run pytest -v

      # ============================================================
      # 11. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker Image
        run: |
          docker build \
            --no-cache \
            -t healthcare-premium-api:${{ github.sha }} .

      # ============================================================
      # 12. VERIFY DOCKER IMAGE
      # ============================================================

      - name: Verify Docker Image
        run: |
          docker images healthcare-premium-api:${{ github.sha }}

      # ============================================================
      # 13. SUCCESS
      # ============================================================

      - name: Pipeline Completed
        run: |
          echo "CI Pipeline completed successfully."
